name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect pages
        run: |
          mkdir -p dist

          cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0;url=https://denuchange.vercel.app/" />
            <link rel="canonical" href="https://denuchange.vercel.app/" />
            <title>Redirecting…</title>
          </head>
          <body>
            <p>Redirecting to <a href="https://denuchange.vercel.app/">denuchange.vercel.app</a>…</p>
          </body>
          </html>
          EOF

          cat > dist/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Redirecting…</title>
            <script>
              var path = window.location.pathname.replace('/denuchange', '');
              window.location.replace('https://denuchange.vercel.app' + path + window.location.search + window.location.hash);
            </script>
          </head>
          <body>
            <p>Redirecting to <a href="https://denuchange.vercel.app/">denuchange.vercel.app</a>…</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4